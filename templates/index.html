<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Qwen</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Q</div>
        <div>
          <strong>Local Qwen</strong>
          <span>LM Studio</span>
        </div>
      </div>

      <button id="new-chat" class="primary-button">＋ 새 채팅</button>

      <div class="side-section">
        <div class="section-title">
          <span>장기 메모</span>
          <span id="memory-count" class="count-badge">0</span>
        </div>
        <div id="memory-list" class="memory-list"></div>

        <form id="memory-form" class="memory-form">
          <input
            id="memory-input"
            type="text"
            placeholder="기억할 내용 추가"
            autocomplete="off"
          >
          <button type="submit" title="메모 추가">＋</button>
        </form>
      </div>

      <div class="side-section context-section">
        <div class="section-title">
          <span>Context</span>
          <span id="context-label">0 / 8192</span>
        </div>
        <div class="progress">
          <div id="context-bar" class="progress-bar"></div>
        </div>
        <div class="context-sub">
          <span>자동 요약</span>
          <span id="summary-trigger">5500</span>
        </div>
      </div>

      <div class="server-card">
        <div class="status-row">
          <span id="status-dot" class="status-dot"></span>
          <span id="server-status">연결 확인 중...</span>
        </div>
        <div id="model-name" class="model-name">모델 확인 중...</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>로컬 AI</h1>
          <p id="conversation-info">Qwen + 자동 대화 요약</p>
        </div>
        <button id="toggle-memory" class="mobile-button">메모</button>
      </header>

      <div id="summary-notice" class="summary-notice hidden">
        <div>
          <strong>대화가 자동 요약됨</strong>
          <span>오래된 대화를 압축해서 컨텍스트를 확보했어요.</span>
        </div>
        <button id="close-summary">×</button>
      </div>

      <section id="chat" class="chat">
        <div id="empty-state" class="empty-state">
          <div class="empty-logo">Q</div>
          <h2>무엇을 물어볼까요?</h2>
          <p>대화가 길어지면 오래된 내용을 자동으로 요약합니다.</p>

          <div class="suggestions">
            <button>이 C 코드에서 메모리 취약점을 찾아줘</button>
            <button>다익스트라 알고리즘을 설명해줘</button>
            <button>SQL Injection 방어 방법을 알려줘</button>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <form id="chat-form" class="composer">
          <textarea
            id="message-input"
            rows="1"
            placeholder="메시지를 입력하세요"
          ></textarea>
          <button id="send-button" type="submit" aria-label="전송">
            ↑
          </button>
        </form>
        <div class="composer-help">
          Enter 전송 · Shift+Enter 줄바꿈 · 모델은 LM Studio에서 실행됩니다.
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
